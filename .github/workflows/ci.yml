name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Go mod tidy
        run: go mod tidy && git diff --exit-code

      - name: Build
        run: go build -buildvcs=false ./...

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cdk
          POSTGRES_PASSWORD: cdk
          POSTGRES_DB: cdk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download dependencies
        run: go mod download

      - name: Run migrations
        env:
          CDK_DATABASE_URL: postgres://cdk:cdk@localhost:5432/cdk?sslmode=disable
        run: go run ./cmd/migrate up

      - name: Run migrations down
        env:
          CDK_DATABASE_URL: postgres://cdk:cdk@localhost:5432/cdk?sslmode=disable
        run: go run ./cmd/migrate down
